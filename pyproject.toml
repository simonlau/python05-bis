[project]
name = "python05-bis"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [ ]

[tool.pyrefly]
preset = "all"

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.uv.sources]
ex0 = { path = "ex0" }

[dependency-groups]
dev = [
    "allowed>=1.5.5",
    "mypy>=2.4.1",
    "pre-commit>=4.6.2",
    "pyrefly>=0.39.4",
    "pytype>=2024.10.11",
]
